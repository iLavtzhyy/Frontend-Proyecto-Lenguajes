    <main class="grid min-h-screen place-items-center bg-slate-50 p-4 text-slate-950 dark:bg-[#07111f] dark:text-white">
      <form class="panel w-full max-w-lg p-6 shadow-xl sm:p-7" (ngSubmit)="registrar()">
        <p class="text-sm font-black uppercase text-cyan-700 dark:text-cyan-300">Nuevo usuario</p>
        <h1 class="mt-2 text-2xl font-black">Registro con verificacion</h1>
        <p class="mt-2 text-sm leading-6 text-slate-500 dark:text-slate-400">El codigo llega al correo registrado y el email no queda expuesto en la URL.</p>

        <div class="mt-6 grid gap-4 sm:grid-cols-2">
          <input class="campo" placeholder="Nombres" [(ngModel)]="form.nombres" name="nombres" required>
          <input class="campo" placeholder="Apellidos" [(ngModel)]="form.apellidos" name="apellidos" required>
          <input class="campo sm:col-span-2" type="email" placeholder="Correo" [(ngModel)]="form.email" name="email" required>
          <input class="campo" placeholder="Telefono" [(ngModel)]="form.telefono" name="telefono">
          <input class="campo" type="password" placeholder="Contrasena" [(ngModel)]="form.password" name="password" required>
          <select class="campo sm:col-span-2" [(ngModel)]="form.rolSolicitado" name="rolSolicitado">
            <option value="ROLE_CLIENTE">Cliente</option>
            <option value="ROLE_RECEPCIONISTA">Recepcionista</option>
            <option value="ROLE_VETERINARIO">Veterinario</option>
          </select>
        </div>

        <button class="boton-primario mt-6 w-full" type="submit">Enviar solicitud y codigo</button>
        <p class="mt-4 text-sm font-bold text-rose-600 dark:text-rose-300" *ngIf="error">{{ error }}</p>
        <a routerLink="/login" class="mt-5 block text-center text-sm font-bold text-cyan-700 dark:text-cyan-300">Ya tengo cuenta</a>
      </form>
    </main>
